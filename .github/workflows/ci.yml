name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Malware guard
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Take the inspector from the base branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          path=.github/scripts/malware-guard.sh
          if git fetch --no-tags --depth=1 origin "$BASE_BRANCH" \
             && git show "FETCH_HEAD:$path" > "$RUNNER_TEMP/inspector.sh" 2>/dev/null; then
            echo "inspector taken from $BASE_BRANCH"
          else
            cp "$path" "$RUNNER_TEMP/inspector.sh"
            echo "::warning::$BASE_BRANCH has no $path yet, so this run inspects with the copy from the change under inspection. That only happens on the pull request that introduces it."
          fi

          override=false
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != null ]; then
            if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.labels[].name' \
               | grep -qx security-override; then
              override=true
            fi
          fi
          echo "SECURITY_OVERRIDE=$override" >> "$GITHUB_ENV"

      - name: Scan the diff
        run: bash "$RUNNER_TEMP/inspector.sh"

  check:
    name: Check & Test
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  supply-chain:
    name: Supply chain audit
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check all
