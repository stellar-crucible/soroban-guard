[package]
name = "soroban-guard-cli"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the Soroban-Guard security analysis engine"

[[bin]]
name = "soroban-guard"
path = "src/main.rs"

[dependencies]
soroban-guard-core = { path = "../soroban-guard-core", version = "0.1.0" }
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
anyhow = "1.0"
serde_json = "1.0"
