[workspace]
resolver = "2"
members = [
    "crates/soroban-guard-core",
    "crates/soroban-guard-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Stellar Crucible"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/stellar-crucible/soroban-guard"

[workspace.dependencies]
syn = { version = "2.0.119", features = ["full", "visit", "extra-traits"] }
quote = "1.0.39"
proc-macro2 = { version = "1.0.94", features = ["span-locations"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
walkdir = "2.5.0"
thiserror = "2.0.12"
